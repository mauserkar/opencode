services:
  traefik:
    image: traefik:v3.7.13
    container_name: opencode-traefik-gateway
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    cap_add:
      # Required to bind the privileged :80 entrypoint
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-net

networks:
  traefik-net:
    name: traefik-net