# Usage:
#   Copy this file to your target repository as `docker-compose-devbox.yaml`
#   Run PROJECT_NAME=$(basename "$PWD") docker compose -f docker-compose-devbox.yaml up -d

include:
  - path: ${HOME}/.config/opencode/docker-compose.yaml
    project_directory: .

services:
  opencode:
    working_dir: /workspace/${PROJECT_NAME}
    image: opencode-devbox:3.3.1
    environment:
      - OPENCODE_PROFILE=work
      # Add project-specific environment variables here:
      # - LOG_LEVEL=debug
    # volumes:
    #   - ./custom-data:/workspace/${PROJECT_NAME}/custom-data
    # ports:
    #   - "8080:8080"
