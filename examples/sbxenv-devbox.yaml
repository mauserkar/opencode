# Copy this file to your target repository as `sbxenv.yaml`.
# Note: `sbxenv.yaml` has no `include:` keyword like Compose; instead, it inherits
# image, toolchain, default env (TZ, profile, password), credentials, network policy,
# and CPU/RAM resources directly from the v3 kit (`sbx/opencode-devbox`).
#
# Usage:
#   sbx env run sbxenv.yaml \
#     --env-arg projectName="$(basename "$PWD")" \
#     --env-arg configDir="$HOME/.config/opencode"
schemaVersion: "1"
name: opencode-devbox-${{ env.args.projectName }}
agent: opencode-devbox

args:
  projectName:
    required: true
  configDir:
    required: true

kits:
  - source: ${{ env.args.configDir }}/sbx/opencode-devbox
    args:
      configDir: ${{ env.args.configDir }}

workspace: .

additionalWorkspaces:
  - path: ${{ env.args.configDir }}
    readOnly: true

ports:
  - sandbox: 4096
    host: 4096
  # Add project-specific ports here:
  # - sandbox: 8080
  #   host: 8080

# Override kit defaults or add project-specific variables here:
# env:
#   OPENCODE_CONFIG: /home/agent/.config/opencode/profiles/work/opencode.jsonc
#   LOG_LEVEL: debug

# Override kit CPU/memory defaults here:
# sandboxOptions:
#   cpus: 4
#   memory: 8g
