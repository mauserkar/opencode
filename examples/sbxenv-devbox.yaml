# Usage:
#   Copy this file to your target repository as `sbxenv-devbox.yaml`
#   Run sbx env run sbxenv-devbox.yaml --env-arg projectName="$(basename "$PWD")" --env-arg configDir="$HOME/.config/opencode"

schemaVersion: "1"
name: opencode-devbox-${{ env.args.projectName }}
agent: opencode-devbox

args:
  projectName:
    required: true
  configDir:
    required: true
  devboxVersion:
    default: "3.3.1"

kits:
  - source: ${{ env.args.configDir }}/sbx/opencode-devbox
    args:
      configDir: ${{ env.args.configDir }}
      devboxVersion: ${{ env.args.devboxVersion }}

workspace: .

additionalWorkspaces:
  - path: ${{ env.args.configDir }}
    readOnly: true

ports:
  - sandbox: 4096
    host: 4096

env:
  LOG_LEVEL: debug
  OPENCODE_CONFIG: /home/agent/.config/opencode/profiles/work/opencode.jsonc
  OPENCODE_PROFILE: work
  GOOGLE_GENAI_USE_VERTEXAI: true
  GOOGLE_CLOUD_LOCATION: eu
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""
