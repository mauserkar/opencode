# Note: `sbxenv-devbox.yaml` has no `include:` keyword like Compose; instead, it inherits
# image, toolchain, default env (TZ, profile, password), credentials, network policy,
# and CPU/RAM resources directly from the v3 kit (`sbx/opencode-devbox`).
#
# Usage:
#   sbx env run sbxenv-devbox.yaml --env-arg projectName="$(basename "$PWD")" --env-arg configDir="$HOME/.config/opencode"
schemaVersion: "1"
name: opencode-devbox-${{ env.args.projectName }}
agent: opencode-devbox

args:
  projectName:
    required: true
  configDir:
    required: true

kits:
  - source: ${{ env.args.configDir }}/sbx/opencode-devbox
    args:
      configDir: ${{ env.args.configDir }}

workspace: .

additionalWorkspaces:
  - path: ${{ env.args.configDir }}
    readOnly: true

ports:
  - sandbox: 4096
    host: 4096

env:
  LOG_LEVEL: debug
  OPENCODE_CONFIG: /home/agent/.config/opencode/profiles/work/opencode.jsonc
  OPENCODE_PROFIL: work
  GOOGLE_GENAI_USE_VERTEXAI: true
  GOOGLE_CLOUD_LOCATION: eu
  GOOGLE_APPLICATION_CREDENTIAL: ""
  GOOGLE_CLOUD_PROJECT: ""
