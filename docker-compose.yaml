# PROJECT_NAME=$(basename $PWD) docker-compose -f docker-compose.yaml up -d 
name: opencode-devbox-${PROJECT_NAME:?PROJECT_NAME is required}

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
        NODE_MAJOR: ${NODE_MAJOR}
        OPENTOFU_VERSION: ${OPENTOFU_VERSION}
        UV_VERSION: ${UV_VERSION}
        OPENCODE_VERSION: ${OPENCODE_VERSION}
        OPENSPEC_VERSION: ${OPENSPEC_VERSION}
        HELM_VERSION: ${HELM_VERSION}
        KUBECTL_VERSION: ${KUBECTL_VERSION}
        YQ_VERSION: ${YQ_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    # platform: linux/amd64
    image: opencode-devbox:${DEVBOX_VERSION}
    container_name: opencode-devbox-${PROJECT_NAME}
    command: ["--log-level", "debug", "--print-logs"]
    working_dir: /workspace
    volumes:
      # Repository Configuration (read-write: the agent works here)
      - .:/workspace/${PROJECT_NAME}
      # OpenCode Configuration (read-only; each source must already exist on the host)
      - type: bind
        source: ${HOME}/.config/opencode/agents
        target: /home/agent/.config/opencode/agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/commands
        target: /home/agent/.config/opencode/commands
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/skills
        target: /home/agent/.config/opencode/skills
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/scripts
        target: /home/agent/.config/opencode/scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/opencode.jsonc
        target: /home/agent/.config/opencode/opencode.jsonc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/AGENTS.md
        target: /home/agent/.config/opencode/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/profiles
        target: /home/agent/.config/opencode/profiles
        read_only: true
        bind:
          create_host_path: false
      # Workdir
      - opencode-home:/home/agent
      - opencode-workspace:/workspace
    tmpfs:
      - /tmp:size=512m
    environment:
      - TZ=UTC
      - OPENCODE_CONFIG=/home/agent/.config/opencode/profiles/${OPENCODE_PROFILE:-personal}/opencode.jsonc
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD-opencode}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: 8g
    cpus: 4.0
    restart: always
    # Only necessary for the Traefik gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_NAME}.docker.localhost`)"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=4096"
    networks:
      - traefik-net

volumes:
  opencode-home:
    name: opencode-devbox-home-${PROJECT_NAME}
  opencode-workspace:
    name: opencode-devbox-workspace-${PROJECT_NAME}

networks:
  traefik-net:
    external: true
