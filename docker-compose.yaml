# PROJECT_NAME=$(basename $PWD) docker-compose -f docker-compose.yaml up -d 
name: opencode-devbox-${PROJECT_NAME}

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    image: opencode-devbox:1.5.0
    container_name: opencode-devbox-${PROJECT_NAME}
    command: opencode serve --hostname 0.0.0.0 --port 4096 --log-level DEBUG --print-logs
    working_dir: /workspace
    volumes:
      # Repository Configuration
      - .:/workspace/${PROJECT_NAME}
      # OpenCode Configuration
      - $HOME/.config/opencode/agents:/home/ubuntu/.config/opencode/agents
      - $HOME/.config/opencode/command:/home/ubuntu/.config/opencode/command
      - $HOME/.config/opencode/skills:/home/ubuntu/.config/opencode/skills
      - $HOME/.config/opencode/scripts:/home/ubuntu/.config/opencode/scripts
      - $HOME/.config/opencode/opencode.jsonc:/home/ubuntu/.config/opencode/opencode.jsonc
      - $HOME/.config/opencode/AGENTS.md:/home/ubuntu/.config/opencode/AGENTS.md
      - $HOME/.config/opencode/SECURITY.md:/home/ubuntu/.config/opencode/SECURITY.md
      - $HOME/.config/opencode/profiles:/home/ubuntu/.config/opencode/profiles
      # Workdir
      - opencode-home:/home/ubuntu
      - opencode-workspace:/workspace
    tmpfs:
      - /tmp:size=256m
    environment:
      - TZ=UTC
      - OPENCODE_CONFIG=/home/ubuntu/.config/opencode/profiles/${OPENCODE_PROFILE:-personal}/opencode.jsonc
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: ${OPENCODE_MEM_LIMIT:-8g}
    cpus: ${OPENCODE_CPUS:-4.0}
    restart: always
    # Only necessary for the Traefik gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_NAME}.docker.localhost`)"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=4096"
    networks:
      - traefik-net

volumes:
  opencode-home:
    name: opencode-devbox-home-${PROJECT_NAME}
  opencode-workspace:
    name: opencode-devbox-workspace-${PROJECT_NAME}

networks:
  traefik-net:
    external: true