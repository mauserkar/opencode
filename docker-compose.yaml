# PROJECT_NAME=$(basename $PWD) docker-compose -f docker-compose.yaml up -d 
name: opencode-devbox-${PROJECT_NAME:?PROJECT_NAME is required}

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    image: opencode-devbox:1.7.0
    container_name: opencode-devbox-${PROJECT_NAME}
    command: opencode serve --hostname 0.0.0.0 --port 4096 --log-level DEBUG --print-logs
    working_dir: /workspace
    volumes:
      # Repository Configuration (read-write: the agent works here)
      - .:/workspace/${PROJECT_NAME}
      # OpenCode Configuration (read-only; each source must already exist on the host)
      - type: bind
        source: ${HOME}/.config/opencode/agents
        target: /home/ubuntu/.config/opencode/agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/commands
        target: /home/ubuntu/.config/opencode/commands
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/skills
        target: /home/ubuntu/.config/opencode/skills
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/scripts
        target: /home/ubuntu/.config/opencode/scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/opencode.jsonc
        target: /home/ubuntu/.config/opencode/opencode.jsonc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/AGENTS.md
        target: /home/ubuntu/.config/opencode/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/SECURITY.md
        target: /home/ubuntu/.config/opencode/SECURITY.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode/profiles
        target: /home/ubuntu/.config/opencode/profiles
        read_only: true
        bind:
          create_host_path: false
      # Workdir
      - opencode-home:/home/ubuntu
      - opencode-workspace:/workspace
    tmpfs:
      - /tmp:size=256m
    environment:
      - TZ=UTC
      - OPENCODE_CONFIG=/home/ubuntu/.config/opencode/profiles/${OPENCODE_PROFILE:-personal}/opencode.jsonc
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: ${OPENCODE_MEM_LIMIT:-8g}
    cpus: ${OPENCODE_CPUS:-4.0}
    restart: always
    # Only necessary for the Traefik gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_NAME}.docker.localhost`)"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=4096"
    networks:
      - traefik-net

volumes:
  opencode-home:
    name: opencode-devbox-home-${PROJECT_NAME}
  opencode-workspace:
    name: opencode-devbox-workspace-${PROJECT_NAME}

networks:
  traefik-net:
    external: true