# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: OpenCode Devbox
description: OpenCode server with the same toolchain and configuration layout as the Docker devbox
sourceUrl: https://github.com/anomalyco/opencode
licenses: [MIT]

args:
  goVersion:
    default: "1.27.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: GO_VERSION
  opentofuVersion:
    default: "1.13.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENTOFU_VERSION
  uvVersion:
    default: "0.12.22"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: UV_VERSION
  opencodeVersion:
    default: "2.1.2"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENCODE_VERSION
  openspecVersion:
    default: "1.14.3"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENSPEC_VERSION
  helmVersion:
    default: "4.0.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: HELM_VERSION
  kubectlVersion:
    default: "1.37.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: KUBECTL_VERSION
  yqVersion:
    default: "4.53.6"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: YQ_VERSION
  pythonVersion:
    default: "3.14"
    pattern: '^[0-9]+\.[0-9]+$'
    buildArg: PYTHON_VERSION
  configDir:
    required: true
    description: Host path of the OpenCode configuration directory to mount
    env: CONFIG_DIR

capabilities:
  # The server is meant to stay up independently of attached clients.
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/long-running@1

  # The Compose devbox has unrestricted egress. Keep the same behavior here;
  # narrow this list if you want the sandbox proxy to enforce a policy.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "**"

  # Mirror the OpenCode configuration into the sandbox home so the global
  # config (opencode.jsonc, agents/, commands/, skills/) is discovered.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Link the mounted OpenCode configuration into the agent home
          user: "0"
          env: [CONFIG_DIR]
          command:
            - sh
            - -c
            - |
              rm -rf /home/agent/.config/opencode
              ln -s "$CONFIG_DIR" /home/agent/.config/opencode
              chown -h agent:agent /home/agent/.config/opencode

  # Provider credentials are injected by the sandbox proxy. Each entry is
  # optional, so a sandbox still starts when that secret is not configured.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google Gemini API access
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.x.ai
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Groq API access
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - domain: api.groq.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - domain: openrouter.ai
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub API access
    config:
      service: github
      phase: runtime
      apiKey:
        name: GITHUB_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
